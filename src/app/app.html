<main class="main w-full lg:min-w-[100vw] h-full lg:min-h-[100vh] flex items-start justify-center flex-1 lg:p-10 p-5 relative">
  <div class="content flex flex-col-reverse lg:flex-row items-start justify-center gap-20 lg:max-w-[1440px] w-full">
    <app-board
      [gameID]="gameID()"
      [cells]="cells()"
      [cols]="cols"
      (cellClick)="onCellClick($event)"
      (cellRightClick)="onCellRightClick($event.event, $event.cell)"
    ></app-board>
    <app-sidebar
      class="w-full lg:w-[20rem]"
      [rows]="rows"
      [cols]="cols"
      [volume]="volume"
      [musicVolume]="musicVolume"
      [mines]="totalMines"
      [totalMines]="totalMines"
      [flagsCount]="flagsCount()"
      [remainingMines]="remainingMines()"
      [gameOver]="gameOver()"
      [gameWon]="gameWon()"
      [durationSeconds]="gameDurationSeconds()"
      (newGame)="newGame()"
      (settingsChange)="onSettingsChange($event)"
    ></app-sidebar>
  </div>
</main>
<router-outlet />
