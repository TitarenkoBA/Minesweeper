<div id="sticky-sidebar-container" class="w-full lg:min-w-[20rem] flex flex-col lg:items-start items-center lg:block justify-center">
  <div class="flex flex-col w-full items-center">
    <div class="toc min-h-[5rem] flex items-center justify-center uppercase text-[2rem] px-5 engraved-text">
      Minesweeper
    </div>
    <div class="flex  w-full items-center gap-4 justify-center">
      <div 
        class="toc py-1 px-3 text-[2rem] text-center max-w-[10rem] mx-auto engraved-text"
        [upCustomTooltip]="'Время от начала игры'"
      >
        {{ formattedDuration }}
      </div>

      <button 
        class="control-button toc mx-auto" (click)="onNewGameClick()"
        [upCustomTooltip]="'Начать игру заново'"
      >
        <img src="./assets/images/icons8-refresh.svg" alt="bomb" class="w-[2rem]" />
      </button>

      <button 
        class="control-button toc mx-auto {{soundService.isSoundEnabled() ? '' : 'opacity-50'}}" 
        (click)="toggleSound()"
        [upCustomTooltip]="soundService.isSoundEnabled() ? 'Выключить звуковые эффекты' : 'Включить звуковые эффекты'"
      >
        @if (!soundService.isSoundEnabled()) {
          <img src="./assets/images/speaker-low-volume.svg" alt="low-volume" class="w-[2rem] grayscale-50" />
        } @else {
          <img src="./assets/images/speaker-high-volume.svg" alt="high-volume" class="w-[2rem] grayscale-50" />
        }
      </button>

      <button 
        class="control-button toc mx-auto {{gameService.isSettingsOpen() ? 'opacity-50' : ''}}" 
        (click)="gameService.openSettings()"
        [upCustomTooltip]="'Открыть настройки'"
      >
        <img src="./assets/images/icons8-settings.svg" alt="settings" class="w-[2rem]" />
      </button>

      @if (isRadioPlayed()) {
        <button 
          class="relative control-button toc mx-auto"
          (click)="stopRadio()"
          [upCustomTooltip]="'Выключить музыку'"
        >
          <img src="./assets/images/stop-svgrepo-com.svg" alt="stop-radio" class="w-[2rem]" />
          <img src="./assets/images/cb17b80a942d7c317a35ff1324fae12f.gif" alt="playing-radio" class="z-[1] w-[90%] absolute lg:left-0.5 left-1 right-1 lg:bottom-[-40%] bottom-[-25%]" />
        </button>
      } @else {
        <button 
          class="control-button toc mx-auto" 
          (click)="playRadio()"
          [upCustomTooltip]="'Включить музыку'"
        >
          <img src="./assets/images/play-fill-svgrepo-com.svg" alt="paly-radio" class="w-[2rem]" />
        </button>
      }
    </div>
  </div>
  <div id="sticky-sidebar-stuff">
    <div class="w-full toc p-4 inner-light-shadow">
      <div class="status-line flex items-center ">
        Мины всего: {{ gameService.totalMines }} 
      </div>
      <div class="status-line">
        Поставлено флагов: {{ gameService.flagsCount() }}
      </div>
      <div class="status-line">
        Предполагаемых мин без флагов: {{ gameService.remainingMines() }}
      </div>
    </div>
  </div>
</div>
